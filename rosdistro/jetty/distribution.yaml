      url: https://github.com/gazebosim/gz-utils
      version: gz-utils4
    status: maintained
  sdformat:
    release:
      tags:
        release: sdformat16_{upstream_version}
      url: https://github.com/gazebosim/sdformat.git
      version: 16.1.0-2
