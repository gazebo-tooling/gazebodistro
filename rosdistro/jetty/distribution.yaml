%YAML 1.1
# Gazebo Jetty distribution file - see REP 143
# http://ros.org/reps/rep-0143.html
#
# source.version is the stable branch; release.version is the exact Debian
# version shipped on packages.osrfoundation.org for Ubuntu Noble.
---
type: distribution
version: 2
release_platforms:
  ubuntu:
    - noble
repositories:
  gz-cmake:
    release:
      tags:
        release: gz-cmake5_{upstream_version}
      url: https://github.com/gazebosim/gz-cmake.git
      version: 5.1.1-2
    source:
      type: git
      url: https://github.com/gazebosim/gz-cmake
      version: gz-cmake5
    status: maintained
  gz-common:
    release:
      tags:
        release: gz-common7_{upstream_version}
      url: https://github.com/gazebosim/gz-common.git
      version: 7.4.0-1
    source:
      type: git
      url: https://github.com/gazebosim/gz-common
      version: gz-common7
    status: maintained
  gz-fuel-tools:
    release:
      packages:
        - gz-fuel_tools
      tags:
        release: gz-fuel-tools11_{upstream_version}
      url: https://github.com/gazebosim/gz-fuel-tools.git
      version: 11.0.0-2
    source:
      type: git
      url: https://github.com/gazebosim/gz-fuel-tools
      version: gz-fuel-tools11
    status: maintained
  gz-gui:
    release:
      tags:
        release: gz-gui10_{upstream_version}
      url: https://github.com/gazebosim/gz-gui.git
      version: 10.1.0-1
