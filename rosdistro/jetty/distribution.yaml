      tags:
        release: gz-jetty_{upstream_version}
      url: https://github.com/gazebosim/gz-jetty.git
      version: 1.0.0-2
    source:
      type: git
      url: https://github.com/gazebosim/gz-jetty
      version: main
    status: maintained
  gz-launch:
    release:
      tags:
        release: gz-launch9_{upstream_version}
      url: https://github.com/gazebosim/gz-launch.git
      version: 9.0.1-1
    source:
      type: git
      url: https://github.com/gazebosim/gz-launch
      version: gz-launch9
    status: maintained
  gz-math:
    release:
      tags:
