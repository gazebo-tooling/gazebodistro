      tags:
        release: gz-physics9_{upstream_version}
      url: https://github.com/gazebosim/gz-physics.git
      version: 9.5.0-1
    source:
      type: git
      url: https://github.com/gazebosim/gz-physics
      version: gz-physics9
    status: maintained
  gz-plugin:
    release:
      tags:
        release: gz-plugin4_{upstream_version}
      url: https://github.com/gazebosim/gz-plugin.git
      version: 4.0.0-2
    source:
