        release: gz-msgs12_{upstream_version}
      url: https://github.com/gazebosim/gz-msgs.git
      version: 12.0.2-2
    source:
      type: git
      url: https://github.com/gazebosim/gz-msgs
      version: gz-msgs12
    status: maintained
  gz-physics:
