%YAML 1.1
# Gazebo Jetty distribution file - see REP 143
# http://ros.org/reps/rep-0143.html
#
# source.version is the stable branch; release.version is the exact Debian
# version shipped on packages.osrfoundation.org for Ubuntu Noble.
---
type: distribution
version: 2
release_platforms:
  ubuntu:
    - noble
repositories:
  gz-cmake:
    source:
      type: git
      url: https://github.com/gazebosim/gz-cmake
      version: gz-cmake5
    status: maintained
  gz-common:
    source:
      type: git
      url: https://github.com/gazebosim/gz-common
      version: gz-common7
    status: maintained
  gz-fuel-tools:
    source:
      type: git
      url: https://github.com/gazebosim/gz-fuel-tools
      version: gz-fuel-tools11
    status: maintained
  gz-gui:
    source:
      type: git
      url: https://github.com/gazebosim/gz-gui
      version: gz-gui10
    status: maintained
  gz-jetty:
    source:
      type: git
      url: https://github.com/gazebosim/gz-jetty
      version: main
    status: maintained
  gz-launch:
    source:
      type: git
      url: https://github.com/gazebosim/gz-launch
      version: gz-launch9
    status: maintained
  gz-math:
    source:
      type: git
      url: https://github.com/gazebosim/gz-math
      version: gz-math9
    status: maintained
  gz-msgs:
    source:
      type: git
      url: https://github.com/gazebosim/gz-msgs
      version: gz-msgs12
    status: maintained
  gz-physics:
    source:
      type: git
      url: https://github.com/gazebosim/gz-physics
      version: gz-physics9
    status: maintained
  gz-plugin:
    source:
      type: git
      url: https://github.com/gazebosim/gz-plugin
      version: gz-plugin4
    status: maintained
  gz-rendering:
    source:
      type: git
      url: https://github.com/gazebosim/gz-rendering
      version: gz-rendering10
    status: maintained
  gz-sensors:
    source:
      type: git
      url: https://github.com/gazebosim/gz-sensors
      version: gz-sensors10
    status: maintained
  gz-sim:
    source:
      type: git
      url: https://github.com/gazebosim/gz-sim
      version: gz-sim10
    status: maintained
  gz-tools:
    source:
      type: git
      url: https://github.com/gazebosim/gz-tools
      version: gz-tools2
    status: maintained
  gz-transport:
    source:
      type: git
      url: https://github.com/gazebosim/gz-transport
      version: gz-transport15
    status: maintained
  gz-utils:
    source:
      type: git
      url: https://github.com/gazebosim/gz-utils
      version: gz-utils4
    status: maintained
  sdformat:
    source:
      type: git
      url: https://github.com/gazebosim/sdformat
      version: sdf16
    status: maintained
