%YAML 1.1
# Gazebo rosdistro index - see REP 143 and REP 153
# http://ros.org/reps/rep-0143.html
#
# Canonical URL once merged to master, and the value consumers point at:
# https://raw.githubusercontent.com/gazebo-tooling/gazebodistro/master/rosdistro/index-v4.yaml
---
type: index
version: 4
distributions:
  jetty:
    distribution:
      - jetty/distribution.yaml
    # Regenerate with, from the rosdistro/ directory:
    #   python3 -m rosdistro.cli.rosdistro_build_cache --preclean \
    #     index-v4.yaml jetty
    # Both jetty-cache.yaml and jetty-cache.yaml.gz are committed. CI
    # rebuilds the plain file and fails if it drifts from the distribution
    # file; the test suite fails if the .gz does not decompress to it.
    distribution_cache: jetty-cache.yaml.gz
    distribution_status: active
    # REP 153 defines only ros1 and ros2, neither of which describes Gazebo,
    # and no value for a non-ROS distribution exists. ros2 is kept for tool
    # compatibility; it makes ros_buildfarm apply ROS 2 semantics such as
    # injecting a ros_workspace dependency that does not exist here.
    distribution_type: ros2
    python_version: 3
  # ROS 2 Lyrical extending Jetty (REP-2015 test). The distribution file is
  # the KmoM88 fork of ros/rosdistro pinned to a commit; bump the SHA to pick
  # up newer lyrical content, then rebuild lyrical-cache.yaml.gz (see
  # README.md). The cache is built from the official lyrical cache plus this
  # version-3 file so that consumers merge jetty in through the cache path.
  lyrical:
    distribution:
      - https://raw.githubusercontent.com/KmoM88/ros-rosdistro/1fed7036e3b0/lyrical/distribution.yaml  # yamllint disable-line rule:line-length
    distribution_cache: lyrical-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
