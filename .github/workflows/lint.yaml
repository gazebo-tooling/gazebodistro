name: Validate gazebodistro
on: [push, pull_request]

jobs:
  pytest:
    name: PyTest
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: [3.12]
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Fetch upstream (to enable diff)
      run: |
        git remote add unittest_upstream_comparision https://github.com/gazebo-tooling/gazebodistro.git || git remote set-url unittest_upstream_comparision https://github.com/gazebo-tooling/gazebodistro.git
        git fetch --no-tags --depth=1 unittest_upstream_comparision master
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install PyYAML argparse
        pip install 'rosdistro==1.0.1' catkin_pkg
        pip install pytest pytest-cov
        pip install unidiff
        pip install PyGithub
    - name: Run PyTest
      run: pytest -v
  yamllint:
    name: Yaml Linting
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: [3.12]
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install yamllint
    - name: Run yamllint
      run: yamllint *.yaml rosdistro/
  cache-freshness:
    name: Distribution cache is up to date
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v1
      with:
        python-version: '3.12'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install 'rosdistro==1.0.1' PyYAML catkin_pkg
    # --preclean discards the committed cache and rebuilds every entry from
    # the git tags, so a tags.release prefix naming a tag that does not exist
    # fails here instead of being papered over by the stale cached entry.
    - name: Rebuild the cache
      working-directory: rosdistro
      run: python3 -m rosdistro.cli.rosdistro_build_cache --preclean index-v4.yaml jetty
    # Only the plain YAML is compared. gzip embeds an mtime, so the .gz bytes
    # differ on every run even when the content is identical.
    - name: Fail if the committed cache is stale
      run: |
        git diff --exit-code -- rosdistro/jetty-cache.yaml \
          || { echo "::error::rosdistro/jetty-cache.yaml is stale. Regenerate it:"; \
               echo "::error::  cd rosdistro && python3 -m rosdistro.cli.rosdistro_build_cache --preclean index-v4.yaml jetty"; \
               exit 1; }
  rep2015-extension:
    name: Lyrical extends Jetty through the caches (REP-2015)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v1
      with:
        python-version: '3.12'
    # The stock rosdistro rejects distribution file version 3, so this job
    # installs the fork that implements the REP-2015 `extends` element.
    - name: Install the rosdistro fork
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install 'rosdistro @ git+https://github.com/KmoM88/rosdistro@436f5429fc1e' PyYAML catkin_pkg pytest
    - name: Run the extension tests
      run: pytest -v test/test_rosdistro_extension.py
